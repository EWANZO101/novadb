[package]
name = "novadb-dashboard"
description = "NovaDB control dashboard + identity (Stage 9): Argon2id, TOTP, OAuth linking, hash-chained audit log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
novadb-storage.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
getrandom = "0.2"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
