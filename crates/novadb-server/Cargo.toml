[package]
name = "novadb-server"
description = "NovaDB server: MySQL wire protocol over TLS on 127.0.0.1:3307"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
novadb-raft = { path = "../novadb-raft" }
novadb-storage.workspace = true
novadb-protocol.workspace = true
novadb-sql.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
argon2 = "0.5"
getrandom = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
