[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "LicenseRef-NovaDB-Proprietary"
publish = false

[workspace.dependencies]
novadb-storage = { path = "crates/novadb-storage" }
novadb-protocol = { path = "crates/novadb-protocol" }
novadb-sql = { path = "crates/novadb-sql" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "allow"

[profile.release]
debug = 1
overflow-checks = true
panic = "unwind"

[profile.dev]
overflow-checks = true
